services:
  fmre-web:
    build:
      context: .
      target: dev
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    depends_on:
      - fmre-api

  fmre-api:
    build:
      context: ./server
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file: ./server/.env
