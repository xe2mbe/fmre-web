services:
  fmre-web:
    build:
      context: .
      target: dev
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    depends_on:
      - fmre-api

  fmre-api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
    env_file: ./server/.env
